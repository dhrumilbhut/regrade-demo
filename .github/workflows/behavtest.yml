name: BehavTest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write # for the result comment on pull requests

jobs:
  behavtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dhrumilbhut/behavtest@v0
        with:
          suite: suite.mjs
          repeat: 3
          comment: true
